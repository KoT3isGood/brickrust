[package]
name = "brickrust"
edition = "2021"
license = "MIT"
description = "A library which allows Brick Rigs modding"
readme = "readme.md"
repository = "https://github.com/KoT3isGood/brickrust"
# first is brick rigs version
version = "0.0.3+br1.11.5"
publish = true

[features]
default=["br_1_11"]
br_bricks_1_10=[]
br_1_11=["br_bricks_1_10"]
br_1_10_7=["br_bricks_1_10"]
process_internal_debug=[]
brmk_1_10_7=["br_1_10_7"]

[workspace]
members = [ "macros", "brickworks", "xinput_proxy" ]

[dependencies]
bitflags= "2.13.1"
brickrust_macros = { version = "0.0.2", path = "macros" }
brickworks = { version = "0.0.3", path = "brickworks" }
min_hook_rs = "2.2.1"
inventory = "0.3.24"
wchar = "0.11.1"
backtrace = "0.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[example]]
name = "basic_init"
crate-type = ["dylib"]

[[example]]
name = "custom_brick_properties"
crate-type = ["dylib"]

[[example]]
name = "workshop_allow_modded"
crate-type = ["dylib"]

[[example]]
name = "function_tests"
crate-type = ["dylib"]

[[example]]
name = "better_crashes"
crate-type = ["dylib"]

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-gnu"]
default-target = "x86_64-pc-windows-gnu"
